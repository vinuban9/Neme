<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#14171b">
<title>NEME Parts Finder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&family=DM+Sans:wght@400;500;700&family=DM+Mono:wght@400;500&display=swap">
<style>
/* Counter tool: measure strip on top, drawing grid below. NEME POS gauge-cluster palette. */
:root{
  --bg:#edeff2;--sur:#ffffff;--sur2:#e4e7eb;--brd:#d3d7dc;--ink:#171a1e;--mut:#5f6772;
  --acc:#e8451f;--acc-ink:#ffffff;--grn:#16915a;--yel:#a86a00;--blu:#1e7fc2;
  --paper:#ffffff;--line-ink:invert(0);
  --f-disp:"Rajdhani","Arial Narrow",system-ui,sans-serif;
  --f-body:"DM Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"DM Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#14171b;--sur:#1b1f24;--sur2:#232830;--brd:#33393f;--ink:#eceff3;--mut:#9aa3ae;
  --acc:#ff5a36;--acc-ink:#1a0a05;--grn:#33d690;--yel:#ffc145;--blu:#3fa9f5;--paper:#e9ecef;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#14171b;--sur:#1b1f24;--sur2:#232830;--brd:#33393f;--ink:#eceff3;--mut:#9aa3ae;
  --acc:#ff5a36;--acc-ink:#1a0a05;--grn:#33d690;--yel:#ffc145;--blu:#3fa9f5;--paper:#e9ecef;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 40px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:1100px;margin:0 auto;display:grid;gap:16px}
h1,h2{font-family:var(--f-disp);font-weight:700;letter-spacing:.02em;margin:0;text-wrap:balance}
h1{font-size:1.6rem}h1 b{color:var(--acc)}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;padding-top:18px}
.top p{margin:2px 0 0;color:var(--mut);font-size:.9rem;max-width:60ch}
.lbl{font-family:var(--f-disp);font-weight:700;font-size:.78rem;letter-spacing:.12em;text-transform:uppercase;color:var(--mut)}
.panel{background:var(--sur);border:1px solid var(--brd);border-radius:10px;padding:14px;display:grid;gap:12px;min-width:0}
@media (min-width:701px){.measure{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;box-shadow:0 6px 18px -12px #0006}}
.mrow{display:grid;grid-template-columns:repeat(3,minmax(0,1fr)) minmax(0,1.1fr);gap:10px}
.fld{display:grid;gap:4px;min-width:0}
.fld input,.fld select{width:100%;min-width:0;background:var(--sur2);border:1px solid var(--brd);border-radius:8px;padding:10px;color:var(--ink);
  font-family:var(--f-mono);font-size:1.25rem;font-variant-numeric:tabular-nums}
.fld input:focus-visible,.fld select:focus-visible,button:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
.fld .u{font-size:.75rem;color:var(--mut)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--brd);background:var(--sur2);color:var(--ink);border-radius:999px;padding:6px 12px;font:600 .85rem var(--f-body);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
.chip small{font-family:var(--f-mono);opacity:.7;margin-left:3px}
.opts{display:flex;gap:16px;flex-wrap:wrap;align-items:center;font-size:.88rem}
.opts label{display:flex;gap:6px;align-items:center;cursor:pointer}
.opts input{accent-color:var(--acc);width:17px;height:17px}
.howto{display:grid;grid-template-columns:auto minmax(0,1fr);gap:14px;align-items:center}
.howto img{width:230px;background:var(--paper);border-radius:6px;padding:4px}
.howto ul{margin:0;padding-left:18px;font-size:.88rem;color:var(--mut)}
.howto b{color:var(--ink)}
details.help summary{cursor:pointer;font-size:.88rem;color:var(--blu);font-weight:600}
.status{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.status .n{font-family:var(--f-disp);font-weight:700;font-size:1.2rem}
.status .ex{font-size:.8rem;color:var(--yel);font-weight:600}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,250px),1fr));gap:12px}
.card{background:var(--sur);border:1px solid var(--brd);border-radius:10px;overflow:hidden;display:grid;grid-template-rows:auto 1fr;cursor:pointer;text-align:left;color:inherit;font:inherit;padding:0}
.card.instock{border-color:var(--grn);box-shadow:inset 0 0 0 1px var(--grn)}
.card .pic{background:var(--paper);aspect-ratio:4/3;max-width:100%;display:flex;align-items:center;justify-content:center;padding:6px;overflow:hidden}
.card .pic img{max-height:100%;max-width:100%;object-fit:contain}
.card .pic .none{color:#666;font-size:.8rem;text-align:center;padding:10px}
.card .body{padding:10px 12px;display:grid;gap:6px;align-content:start}
.hd{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.no{font-family:var(--f-disp);font-weight:700;font-size:1.35rem;letter-spacing:.03em}
.mk{font-size:.75rem;color:var(--mut);font-weight:600}
.dims{font-family:var(--f-mono);font-size:.85rem;font-variant-numeric:tabular-nums}
.dims .d{color:var(--mut)}
.dims .good{color:var(--grn)}.dims .near{color:var(--yel)}
.tags{display:flex;gap:5px;flex-wrap:wrap}
.tag{font-size:.7rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:2px 7px;border-radius:999px;border:1px solid var(--brd);color:var(--mut)}
.tag.stock{border-color:var(--grn);color:var(--grn)}
.tag.disc{border-color:var(--yel);color:var(--yel)}
.tag.rear{border-color:var(--blu);color:var(--blu)}
.sname{font-size:.8rem;color:var(--grn);font-weight:600;word-break:break-word}
.empty{padding:30px 10px;text-align:center;color:var(--mut)}
.more{justify-self:center;background:var(--sur2);border:1px solid var(--brd);color:var(--ink);border-radius:8px;padding:10px 18px;font:700 .9rem var(--f-body);cursor:pointer}
dialog{border:1px solid var(--brd);border-radius:12px;background:var(--sur);color:var(--ink);padding:0;width:min(720px,calc(100vw - 24px));max-height:calc(100dvh - 24px)}
dialog::backdrop{background:#000a}
.dlg{display:grid;gap:12px;padding:14px}
.dlg .pic{background:var(--paper);border-radius:8px;padding:10px;display:flex;justify-content:center}
.dlg .pic img{max-height:60dvh}
.dlg .x{background:var(--sur2);border:1px solid var(--brd);color:var(--ink);border-radius:8px;padding:8px 14px;font:700 .9rem var(--f-body);cursor:pointer}
.dlg a{color:var(--blu)}
.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;font-size:.9rem}
.kv dt{color:var(--mut)}.kv dd{margin:0;min-width:0;word-break:break-word}
.load{padding:40px;text-align:center;color:var(--mut)}
@media (max-width:700px){
  .mrow{grid-template-columns:repeat(3,minmax(0,1fr))}
  .mrow .fld.num{grid-column:1/-1}
  .howto{grid-template-columns:1fr}.howto img{width:100%;max-width:300px}
  .fld input{font-size:1.1rem;padding:9px}
}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
.scan{display:grid;gap:12px}
.scanrow{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--brd);background:var(--sur2);color:var(--ink);border-radius:8px;padding:11px 16px;font:700 .95rem var(--f-body);cursor:pointer}
.btn.pri{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
.btn[disabled]{opacity:.6;cursor:wait}
.shots{display:flex;gap:8px;flex-wrap:wrap}
.shot{position:relative;width:96px;height:96px;border-radius:8px;overflow:hidden;border:1px solid var(--brd);background:var(--sur2)}
.shot img{width:100%;height:100%;object-fit:cover}
.shot button{position:absolute;top:3px;right:3px;width:24px;height:24px;border-radius:50%;border:0;background:#000b;color:#fff;cursor:pointer;font-size:13px}
.scanmsg{font-size:.9rem;color:var(--mut)}
.scanmsg.err{color:var(--acc)}
.read{display:grid;gap:6px;font-size:.9rem;background:var(--sur2);border-radius:8px;padding:10px 12px}
.read b{font-family:var(--f-mono)}
.picks{display:grid;gap:10px}
.why{font-size:.82rem;color:var(--ink);background:var(--sur2);border-radius:6px;padding:6px 8px}
.rank{font-family:var(--f-mono);font-size:.78rem;font-weight:500;padding:2px 8px;border-radius:999px;background:var(--acc);color:var(--acc-ink)}
.spin{display:inline-block;width:15px;height:15px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}
</style>
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<style>
.modes{display:inline-grid;grid-template-columns:repeat(5,auto);background:var(--sur2);border:1px solid var(--brd);border-radius:10px;padding:3px;gap:3px}
.modes button{border:0;background:transparent;color:var(--mut);border-radius:8px;padding:9px 18px;font:700 1rem var(--f-disp);letter-spacing:.06em;text-transform:uppercase;cursor:pointer}
.modes button[aria-pressed="true"]{background:var(--acc);color:var(--acc-ink)}
.pcs{display:grid;gap:3px;font-family:var(--f-mono);font-size:.8rem;font-variant-numeric:tabular-nums}
.pcs .ln{font-weight:500}
.pcs .x{color:var(--mut)}
.fld datalist{display:none}
@media (max-width:560px){.modes{grid-template-columns:1fr 1fr;width:100%}.modes button{padding:9px 6px}}
.card .pic.spec{background:var(--sur2);aspect-ratio:auto;padding:14px 12px;display:grid;gap:4px;justify-items:start;align-content:center;color:var(--ink)}
.spec .big{font-family:var(--f-disp);font-weight:700;font-size:2rem;line-height:1;font-variant-numeric:tabular-nums}
.spec .big small{font-size:.55em;color:var(--mut);margin-left:2px}
.spec .sub{font-family:var(--f-mono);font-size:.82rem;color:var(--mut)}
.refs{font-family:var(--f-mono);font-size:.78rem;color:var(--mut);word-break:break-word}
.refs b{color:var(--ink);font-weight:500}
.veh{font-size:.8rem;color:var(--mut)}
.reflist{font-family:var(--f-mono);font-size:.85rem;display:flex;flex-wrap:wrap;gap:4px 10px;max-height:30dvh;overflow:auto}
.reflist span.hit{color:var(--acc);font-weight:500}
.card .pic.photo{background:#fff}
.mrow.reg .fld:not(.num){display:none}
.mrow.reg{grid-template-columns:1fr}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <h1>NEME Parts <b>Finder</b></h1>
      <p>Scan, measure or type an OEM number to find the right part in the MK Kashiyama, EXEDY and New-Era catalogs. Green cards are in your NEME POS list.</p>
    </div>
    <div class="modes" role="group" aria-label="Part type">
      <button type="button" id="mPad" aria-pressed="true">Disc pads</button>
      <button type="button" id="mShoe" aria-pressed="false">Brake shoes</button>
      <button type="button" id="mDisc" aria-pressed="false">Clutch disc</button>
      <button type="button" id="mCover" aria-pressed="false">Clutch cover</button>
      <button type="button" id="mReg" aria-pressed="false">Regulators</button>
    </div>
  </header>
  <span class="lbl" id="count">Loading catalog…</span>

  <section class="panel scan" aria-label="Scan">
    <div class="hd"><h2 id="scanH">Scan the old pad</h2><span class="lbl">AI · free Gemini</span></div>
    <div class="scanmsg" id="scanTip"></div>
    <div class="shots" id="shots"></div>
    <div class="scanrow">
      <button class="btn" type="button" id="bCam">📷 Camera</button>
      <button class="btn" type="button" id="bGal">🖼️ Gallery</button>
      <button class="btn pri" type="button" id="bScan">🔍 Find it</button>
    </div>
    <input type="file" id="fCam" accept="image/*" capture="environment" hidden>
    <input type="file" id="fGal" accept="image/*" multiple hidden>
    <div class="scanmsg" id="scanMsg" role="status"></div>
    <div id="scanOut" class="picks"></div>
  </section>

  <section class="panel measure" aria-label="Measurements">
    <div class="mrow">
      <div class="fld"><label class="lbl" for="x" id="lx">Width X</label><input id="x" type="number" inputmode="decimal" step="0.1" min="0"><span class="u" id="ux">mm</span></div>
      <div class="fld"><label class="lbl" for="y" id="ly">Height Y</label><input id="y" type="number" inputmode="decimal" step="0.1" min="0"><span class="u" id="uy">mm</span></div>
      <div class="fld"><label class="lbl" for="z" id="lz">Thick Z</label><input id="z" type="number" inputmode="decimal" step="0.1" min="0"><span class="u" id="uz">mm, optional</span></div>
      <div class="fld num"><label class="lbl" for="q" id="lq">Or part number</label><input id="q" type="search" autocomplete="off" spellcheck="false" style="text-transform:uppercase"><span class="u" id="uq">Part or OEM number</span></div>
    </div>
    <div class="chips" id="drums" hidden></div>
    <div class="chips" id="makers" role="group" aria-label="Vehicle maker"></div>
    <div class="opts">
      <label for="tol">Match within
        <select id="tol" style="background:var(--sur2);border:1px solid var(--brd);border-radius:6px;padding:4px 6px;color:var(--ink);font:inherit">
          <option value="1">±1 mm</option><option value="2" selected>±2 mm</option><option value="3">±3 mm</option><option value="5">±5 mm</option>
        </select></label>
      <label><input type="checkbox" id="onlyStock"> Only in my stock list</label>
      <label><input type="checkbox" id="hideDisc"> Hide discontinued</label>
      <label for="posSel">Position
        <select id="posSel" style="background:var(--sur2);border:1px solid var(--brd);border-radius:6px;padding:4px 6px;color:var(--ink);font:inherit"></select></label>
    </div>
    <details class="help">
      <summary>How to measure</summary>
      <div class="howto" style="margin-top:10px">
        <img id="helpImg" alt="Measurement diagram" src="">
        <ul id="helpList"></ul>
      </div>
    </details>
  </section>

  <div class="status"><span class="n" id="resN"></span><span class="ex" id="exNote"></span></div>
  <div class="grid" id="grid"><div class="load">Loading drawings…</div></div>
  <button class="more" id="more" hidden>Show more</button>
</div>

<dialog id="dlg"><div class="dlg" id="dlgBody"></div></dialog>

  // Returns the best-fitting variant: {t: total mm off, parts:[diffs], v: the matched values}
  function score(p,x,y,z){
    var best=null;
    if(p.kind==='pad'){
      p.d.forEach(function(d){var dx=x?Math.abs(d[0]-x):0,dy=y?Math.abs(d[1]-y):0,dz=z?Math.abs(d[2]-z):0;
        var s={t:dx+dy+dz*0.5,df:[x?dx:null,y?dy:null,z?dz:null],v:d,ok:function(t){return dx<=t&&dy<=t&&dz<=t+1}};if(!best||s.t<best.t)best=s});
    }else if(isCl()){
      if(!p.d)return null;var d=p.d,dx=x?Math.abs(d[0]-x):0;
      if(p.kind==='disc'){var tOk=!y||d[2]===Math.round(y),dz=z&&d[3]?Math.abs(d[3]-z):(z?9:0);
        best={t:dx+dz+(tOk?0:50),df:[x?dx:null,y?(tOk?0:9):null,z?dz:null],v:d,ok:function(t){return dx<=t*2&&tOk&&dz<=Math.max(0.5,t/2)}};}
      else{var dy=y&&d[1]?Math.abs(d[1]-y):(y?9:0),dz2=z&&d[2]?Math.abs(d[2]-z):(z?9:0);
        best={t:dx+dy+dz2,df:[x?dx:null,y?dy:null,z?dz2:null],v:d,ok:function(t){return dx<=t*2&&dy<=t*2&&dz2<=t*2}};}
    }else{
      p.pcs.forEach(function(c){if(!c.R)return;var D=c.R*2,dx=x?Math.abs(D-x):0,dy=y?Math.abs(c.c-y):0,dz=z?Math.abs(c.a-z):0;
        var s={t:dx+dy*1.5+dz,df:[x?dx:null,y?dy:null,z?dz:null],v:c,ok:function(t){return dx<=t*1.5&&dy<=t&&dz<=Math.max(0.6,t/2)}};if(!best||s.t<best.t)best=s});
    }
    return best;
  }

  function filtered(){
    var x=parseFloat($('x').value)||0,y=parseFloat($('y').value)||0,z=parseFloat($('z').value)||0;
    var q=norm($('q').value),tol=parseFloat($('tol').value)||2,pos=$('posSel').value;
    if(MODE==='shoe'&&/^K\d/.test(q))q='Z'+q.slice(1);
    var out=[];
    items().forEach(function(p){
      if(st.maker&&(p.kind==='reg'?p.mk.indexOf(st.maker)<0:mkKey(p)!==st.maker))return;
      if(st.brand&&p.kind==='reg'&&p.brs.indexOf(st.brand)<0)return;
      if($('onlyStock').checked&&!p.s.length)return;
      if($('hideDisc').checked&&p.disc)return;
      if(!posOk(p,pos))return;
      if(q){var hay=norm(p.n)+' '+(p.r||[]).join(' ')+' '+(p.pcs||[]).map(function(c){return c.ln+' '+c.core}).join(' ')+' '+(p.rn||[]).join(' ')+' '+(p.of||[]).map(function(o){return o[0]}).join(' ')+(p.veh?' '+norm(p.veh.join(' ')):'');if(hay.indexOf(q)<0)return}

  function shrink(url,max){return new Promise(function(ok,no){var im=new Image();im.onload=function(){
    var k=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);
    c.getContext('2d').drawImage(im,0,0,c.width,c.height);ok(c.toDataURL('image/jpeg',0.86))};im.onerror=no;im.src=url})}
  function renderShots(){$('shots').innerHTML=shots.map(function(u,i){return '<div class="shot"><img src="'+u+'" alt="Photo '+(i+1)+'"><button type="button" data-del="'+i+'" aria-label="Remove photo">✕</button></div>'}).join('')}
  async function addFiles(list){
    var a=[].slice.call(list||[]);
    for(var i=0;i<a.length;i++){if(shots.length>=2){msg('Two photos are enough: the whole part, and a close-up of any numbers.');break}
      try{shots.push(await shrink(await readFile(a[i]),1400))}catch(e){msg('Could not open that photo.',1)}}
    renderShots();
  }
  $('bCam').onclick=function(){$('fCam').click()};$('bGal').onclick=function(){$('fGal').click()};
  $('fCam').onchange=function(e){addFiles(e.target.files);e.target.value=''};$('fGal').onchange=function(e){addFiles(e.target.files);e.target.value=''};
  $('shots').onclick=function(e){var b=e.target.closest('[data-del]');if(b){shots.splice(+b.dataset.del,1);renderShots()}};
  document.addEventListener('paste',function(e){var it=(e.clipboardData&&e.clipboardData.items)||[],f=[];
    for(var i=0;i<it.length;i++)if(it[i].kind==='file'&&/^image\//.test(it[i].type))f.push(it[i].getAsFile());if(f.length){e.preventDefault();addFiles(f)}});
  function msg(t,err){$('scanMsg').innerHTML=t;$('scanMsg').className='scanmsg'+(err?' err':'')}

  function getKey(){
    var k='';try{k=localStorage.getItem('neme_gemini_api_key')||''}catch(e){}
    if(!k){k=(window.prompt('Paste your FREE Google Gemini API key (the same one the POS invoice scanner uses):')||'').trim();
      if(k){try{localStorage.setItem('neme_gemini_api_key',k)}catch(e){}}}
    return k;
  }
  var MODELS=null;
  async function models(key){
    if(MODELS)return MODELS;var m=[];
    try{var r=await fetch('https://generativelanguage.googleapis.com/v1beta/models?key='+encodeURIComponent(key));
      if(r.ok){var d=await r.json();(d.models||[]).forEach(function(x){var id=(x.name||'').replace('models/','');
        if((x.supportedGenerationMethods||[]).indexOf('generateContent')>=0&&/flash/i.test(id)&&!/lite|image|tts|live|audio/i.test(id))m.push(id)});
        m.sort(function(a,b){return (b.match(/\d+(\.\d+)?/)||[0])[0]-(a.match(/\d+(\.\d+)?/)||[0])[0]})}}catch(e){}
    ['gemini-flash-latest','gemini-2.5-flash'].forEach(function(d){if(m.indexOf(d)<0)m.push(d)});
    return MODELS=m;
  }
  async function gemini(parts){
    var key=getKey();if(!key)throw new Error('No Gemini key entered.');
    var ms=await models(key),last='';
    for(var i=0;i<ms.length;i++){
      for(var t=0;t<2;t++){
        var r;try{r=await fetch('https://generativelanguage.googleapis.com/v1beta/models/'+ms[i]+':generateContent?key='+encodeURIComponent(key),{method:'POST',headers:{'Content-Type':'application/json'},
          body:JSON.stringify({contents:[{parts:parts}],generationConfig:{temperature:0,responseMimeType:'application/json',maxOutputTokens:16384}})})}
        catch(e){last='No internet connection';continue}
        if(!r.ok){var tx=await r.text();last='HTTP '+r.status;try{last+=': '+JSON.parse(tx).error.message}catch(e){}
          if(tx.indexOf('API_KEY_INVALID')>=0){try{localStorage.removeItem('neme_gemini_api_key')}catch(e){}throw new Error('That Gemini key is not valid. Tap Find again to enter it.')}
          if(r.status===429||r.status>=500){await new Promise(function(z){setTimeout(z,2500)});continue}
          break}
        var d=await r.json(),c=(d.candidates&&d.candidates[0])||{};
        var txt=((c.content&&c.content.parts)||[]).map(function(p){return p.text||''}).join('').replace(/```json|```/g,'');
        var a=txt.indexOf('{'),b=txt.lastIndexOf('}');
        if(a>=0&&b>a){try{return JSON.parse(txt.slice(a,b+1))}catch(e){last='Reply cut off ('+(c.finishReason||'?')+') on '+ms[i]}}
        else last='Empty reply ('+(c.finishReason||(d.promptFeedback&&d.promptFeedback.blockReason)||'?')+') on '+ms[i];
        if(c.finishReason==='MAX_TOKENS'||c.finishReason==='SAFETY')break;
      }
    }
    throw new Error('AI could not read it: '+(last||'not available right now')+'. Send this message to Claude if it keeps happening.');
  }
  function img64(u){return {inline_data:{mime_type:u.indexOf('image/png')>0?'image/png':'image/jpeg',data:u.split(',')[1]}}}

  var READ={
    pad:'These photos show a used DISC BRAKE PAD a customer brought to an auto parts shop in Sri Lanka. Respond with ONLY JSON:\n'
      +'{"isPart":true,"numbers":["every code printed or stamped on the backing plate or lining, exactly as written, e.g. D2053M, FDB1234"],"brand":"","ratio":0.42,'
      +'"features":["short facts about the outline: centre slot, wear-indicator clip, notches, tabs, holes, curved top edge, shim"],"position":"front|rear|unknown"}\n'
      +'isPart=false if it is not a disc brake pad. ratio = height divided by width of the BACKING PLATE seen from above (0.25-0.9). Read digits carefully (0/O, 1/I, 5/S, 8/B). Never invent numbers.',
    shoe:'These photos show a used DRUM BRAKE SHOE a customer brought to an auto parts shop in Sri Lanka. Respond with ONLY JSON:\n'
      +'{"isPart":true,"numbers":["every code printed or stamped on the web, rim or lining, exactly as written, e.g. K2305, LN2305, M2305"],"brand":"",'
      +'"features":["short facts about the WEB outline: number and position of holes, spring hooks, notches at each end, adjuster slot, parking-lever pin or lever, wear-indicator, lining covers full or partial arc"],'
      +'"parking":false}\nisPart=false if it is not a drum brake shoe. parking=true if a parking-brake lever or pin is fitted. Read digits carefully. Never invent numbers.',
    disc:'These photos show a CLUTCH DISC (clutch plate) or its box/label, brought to an auto parts shop. Respond with ONLY JSON:\n'
      +'{"isPart":true,"numbers":["every part number printed, stamped or on a sticker/box, exactly as written, e.g. ISD104US, TYD149U, 31250-36190, 8-97032-680-0, DT-064"],"brand":"","teeth":0,"features":["short facts: dampers springs count, facing type organic/ceramic buttons"]}\n'
      +'teeth = number of spline teeth in the centre hub if you can clearly count them, else 0. isPart=false if it is not a clutch disc. Read digits carefully. Never invent numbers.',
    reg:'These photos show an alternator VOLTAGE REGULATOR (IC regulator / brush holder, or separate regulator box) brought to an auto parts shop. Respond with ONLY JSON:\n'
      +'{"isPart":true,"numbers":["every number printed or stamped on it or on a sticker, exactly as written, e.g. 126000-1234, 27700-0L020, L190-4315, IVR-108, F00M145236"],"brand":"maker text visible e.g. DENSO, HITACHI, MITSUBISHI, BOSCH or \"\"","maker":"ND|HI|MI|BO|NK|SF|unknown (who made it, from text or typical shape)","volt":"12|24|unknown",'
      +'"terminals":0,"features":["short facts: plug shape, number of pins, pin letters (IG, L, S, B, P, F, E, C), screw holes, heat-sink fins, brushes attached"]}\n'
      +'isPart=false if it is not a voltage regulator. Read digits carefully. Never invent numbers.',
    cover:'These photos show a CLUTCH COVER (pressure plate) or its box/label, brought to an auto parts shop. Respond with ONLY JSON:\n'
      +'{"isPart":true,"numbers":["every part number printed, stamped or on a sticker/box, exactly as written, e.g. ISC506, TYC617, 31210-36240"],"brand":"","features":["short facts: diaphragm fingers or levers, number of bolt holes"]}\n'
      +'isPart=false if it is not a clutch cover. Read digits carefully. Never invent numbers.'
  };
  function pickPool(read){
    var x=parseFloat($('x').value)||0,y=parseFloat($('y').value)||0,z=parseFloat($('z').value)||0,P=items();
    var direct=[];
    if(isReg()){
      (read.numbers||[]).forEach(function(n){var k=norm(n);if(k.length<5)return;
        P.forEach(function(p){if(direct.indexOf(p)>=0)return;if(norm(p.n)===k||p.rn.some(function(r){return r===k||(k.length>=7&&(r.indexOf(k)>=0||k.indexOf(r)>=0)&&r.length>=7)}))direct.push(p)})});
      var vol=$('posSel').value||(/^(12|24)$/.test(read.volt)?read.volt:''),br=st.brand||(REGBR[read.maker]?read.maker:'');
      var base=P.filter(function(p){return direct.indexOf(p)<0&&(!vol||p.v===vol)&&(!st.maker||p.mk.indexOf(st.maker)>=0)});
      if(st.brand)base=base.filter(function(p){return p.brs.indexOf(st.brand)>=0});
      else if(br)base.sort(function(a,b){return (b.brs.indexOf(br)>=0)-(a.brs.indexOf(br)>=0)});
      var lim=st.maker?80:48;
      return {pool:direct.concat(base).slice(0,lim),direct:direct,sized:!!st.maker,total:base.length,lim:lim,br:br,vol:vol};
    }
    if(isCl()){
      (read.numbers||[]).forEach(function(n){var k=norm(n);if(k.length<5)return;
        P.forEach(function(p){if(direct.indexOf(p)>=0)return;if(norm(p.n)===k||(k.length>=8&&p.rn.indexOf(k)>=0)||p.of.some(function(o){return norm(o[0])===k}))direct.push(p)})});
      return {pool:[],direct:direct,sized:!!(x||y||z)};
    }
    (read.numbers||[]).forEach(function(n){var k=norm(n),m=MODE==='pad'?k.match(/[DS]\d{4}[A-Z]?/):k.match(/(?:K|Z|LN|M)(\d{4}[A-Z]?)/);if(!m)return;
      P.forEach(function(p){if(!p.i||direct.indexOf(p)>=0)return;
        var hit=MODE==='pad'?(p.n===m[0]||p.n.replace(/M$/,'')===m[0].replace(/M$/,'')):(p.n.slice(1,5)===m[1].slice(0,4)||p.pcs.some(function(c){return c.ln.slice(2)===m[1]||c.core.slice(1)===m[1]}));
        if(hit)direct.push(p)})});
    var tol=Math.max(parseFloat($('tol').value)||2,2),pos=$('posSel').value;
    var base=P.filter(function(p){return p.i&&(!st.maker||p.n.charAt(1)===st.maker)&&posOk(p,pos)&&(MODE==='pad'?p.d.length:p.pcs.some(function(c){return c.R}))});
    var sized=!!(x||y||z);
    if(sized)base=base.filter(function(p){var s=score(p,x,y,z);return s&&s.ok(tol+1)}).sort(function(a,b){return score(a,x,y,z).t-score(b,x,y,z).t});
    if(MODE==='pad'&&read.ratio){var r=+read.ratio;base.sort(function(a,b){
      var f=function(p){return Math.min.apply(null,p.d.map(function(d){return Math.abs(d[1]/d[0]-r)}))+(x?Math.abs(p.d[0][0]-x)/20:0)};return f(a)-f(b)})}
    if(MODE==='shoe'&&read.parking)base.sort(function(a,b){return (b.poss.P?1:0)-(a.poss.P?1:0)});
    return {pool:direct.concat(base.filter(function(p){return direct.indexOf(p)<0})).slice(0,sized?14:18),direct:direct,sized:sized};
  }
  async function scan(){
    if(busy)return;
    if(!shots.length){msg('Take or choose a photo first.',1);return}
    var x=parseFloat($('x').value)||0,y=parseFloat($('y').value)||0;
    busy=true;var b=$('bScan');b.disabled=true;$('scanOut').innerHTML='';
    try{
      msg('<span class="spin"></span> Step 1 of 2: reading the photo…');
      var read=await gemini(shots.map(img64).concat([{text:READ[MODE]}]));
      if(read.isPart===false){msg('That photo does not look like a '+({pad:'disc brake pad',shoe:'brake shoe',disc:'clutch disc',cover:'clutch cover'})[MODE]+'. Check the Pads / Shoes switch at the top, or retake the photo.',1);return}
      var pk=pickPool(read);
      if(isReg()&&pk.direct.length){showResult(read,pk,[],'');msg('Done. Number matched in the New-Era catalog. Compare the photo and plug before selling.');return}
      if(isReg()&&!pk.direct.length&&pk.total>pk.lim){showResult(read,pk,[],'');
        msg('No number found. '+pk.total+' regulators still fit'+(pk.br?' ('+REGBR[pk.br]+')':'')+'. Tap the vehicle maker (Toyota, Nissan…) above, then tap Find it again.',1);return}
      if(isCl()){
        showResult(read,pk,[],'');
        if(pk.direct.length)msg('Done. Number matched in the EXEDY catalog. Check the size against the part before selling.');
        else msg('No catalog number found on the photo.'+(read.teeth?' AI counted about <b>'+(+read.teeth)+' teeth</b> (count again to confirm).':'')+' Type the outer Ø'+(MODE==='disc'?' and teeth':' and PCD')+' above to search by size.',1);
        if(MODE==='disc'&&read.teeth&&!$('y').value){$('y').placeholder=String(read.teeth)}
        return;
      }
      if(MODE==='shoe'&&!pk.direct.length&&!x&&!y){showResult(read,pk,[],'');msg('No number found on the shoe. Shoes look very alike, so type the drum size or lining width above, then tap Find it again.',1);return}
      if(!pk.pool.length){showResult(read,pk,[],'');msg('No catalog items fit those sizes. Widen the range or clear a size, then scan again.',1);return}
      msg('<span class="spin"></span> Step 2 of 2: comparing with '+pk.pool.length+' catalog drawings…');
      var parts=shots.map(img64);
      parts.push({text:'Above: photo(s) of the customer\'s worn '+({pad:'brake pad',shoe:'brake shoe',reg:'voltage regulator'})[MODE]+'. Below: candidate MK Kashiyama catalog line drawings, each labelled with its number.'});
      pk.pool.forEach(function(p){
        var lab=MODE==='reg'?p.v+'V'+(p.brs.length?', '+p.brs.map(function(b){return REGBR[b]}).join('/'):''):MODE==='pad'?'X '+p.d[0][0]+' mm, Y '+p.d[0][1]+' mm':p.pcs.map(function(c){return c.ln+' '+c.pos+(c.R?' drum '+(c.R*2)+' mm, lining '+c.c+' mm':'')}).join('; ');
        parts.push({text:'Candidate '+p.n+' ('+lab+'):'});parts.push(img64(p.i))});
      parts.push({text:(MODE==='reg'?'Each candidate is a catalog photo plus a drawing of the plug. Which candidate is the SAME regulator as the photographed one? Compare body shape, plug/connector shape and pin count, mounting holes, heat-sink fins and brush holder. Ignore dirt and colour differences. '
          :MODE==='pad'
          ?'Which candidate has the SAME backing-plate outline as the photographed pad? Compare overall proportions, ear/tab shapes at the ends, notches, curve of top and bottom edges, centre slot, wear-indicator position. Ignore lining wear and dirt. '
          :'Which candidate has the SAME shoe web outline as the photographed shoe? Compare the web shape, number and position of holes, spring-hook holes, end notches (anchor and adjuster ends), parking-lever pin. A set drawing may show two shoes; match either one. Mirror images (left/right) count as the same set. Ignore lining wear and rust. ')
        +(read.numbers&&read.numbers.length?'Numbers read from the part: '+read.numbers.join(', ')+'. ':'')
        +'Respond with ONLY JSON: {"ranking":[{"no":"candidate number","score":0-100,"why":"one short sentence"}],"note":"one sentence, e.g. if none match well"} with the best 5, best first.'});
      var cmp=await gemini(parts),P=items();
      var rk=(cmp.ranking||[]).filter(function(r){return P.some(function(p){return p.n===String(r.no).toUpperCase().trim()})}).slice(0,5);
      showResult(read,pk,rk,cmp.note||'');
      msg('Done. Check the picture against the part before selling. Tap a card for details.');
    }catch(e){msg((e&&e.message)||'Scan failed.',1)}
    finally{busy=false;b.disabled=false}
  }
  function showResult(read,pk,rk,note){
    var P=items();
    var h='<div class="read"><div><span class="lbl">Read from photo</span></div>'
      +'<div>Numbers: '+((read.numbers||[]).length?read.numbers.map(function(n){return '<b>'+esc(n)+'</b>'}).join(', '):'none readable')+(read.brand?' · Brand: '+esc(read.brand):'')+'</div>'
      +((read.features||[]).length?'<div style="color:var(--mut)">'+esc(read.features.join(' · '))+'</div>':'')+'</div>';
    if(pk.direct.length)h+='<div class="status"><span class="n">✅ Number found in the catalog</span></div><div class="grid">'+pk.direct.map(function(p){return card({p:p,s:null})}).join('')+'</div>';
    if(rk.length){
      h+='<div class="status"><span class="n">🤖 Closest shapes</span><span class="ex">'+(pk.sized?'Searched near your measurements':'Tip: type a size for a better match')+'</span></div>';
      h+='<div class="grid">'+rk.map(function(r,i){var p=P.find(function(x){return x.n===String(r.no).toUpperCase().trim()});
        return card({p:p,s:null},'<div class="hd"><span class="rank">#'+(i+1)+' · '+(Math.round(+r.score)||0)+'%</span></div><div class="why">'+esc(r.why||'')+'</div>')}).join('')+'</div>';
    }
    if(note)h+='<div class="scanmsg">'+esc(note)+'</div>';
    $('scanOut').innerHTML=h;
  }
  $('bScan').onclick=scan;

  var sm=ls('mkf_mode');try{setMode(['pad','shoe','disc','cover','reg'].indexOf(sm)>=0?sm:'pad',true)}catch(e){showErr(e)}
})();
</script>
